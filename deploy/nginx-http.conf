# ---------------------------------------------------------------------------
# 香港奶龍大學 · bootstrap config (HTTP only)
#
# Use this first so certbot can complete the ACME challenge, then replace it
# with deploy/nginx.conf and reload nginx.
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name xn--psszg58csy9ayt3cnsh.com www.xn--psszg58csy9ayt3cnsh.com;

    root  /var/www/nailong;
    index index.html;
    charset utf-8;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
