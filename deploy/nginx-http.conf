# ---------------------------------------------------------------------------
# 香港奶龍大學 · HTTP deployment (current)
#
# Serves the site on port 80. No TLS / certificate needed.
# When you are ready for HTTPS, switch to deploy/nginx.conf.
# ---------------------------------------------------------------------------

# www → apex
server {
    listen      80;
    listen      [::]:80;
    server_name www.xn--psszg58csy9ayt3cnsh.com;

    return 301 http://xn--psszg58csy9ayt3cnsh.com$request_uri;
}

server {
    listen      80;
    listen      [::]:80;
    server_name xn--psszg58csy9ayt3cnsh.com;

    root  /var/www/nailong;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Kept for a later certbot run; harmless over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    # Never serve secrets or dotfiles from the web root.
    location ~* \.(key|pem|crt|env|ini|log|sh)$ { deny all; }
    location ~ /\. { deny all; }

    # One-page gateway: every path shows the splash.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location ~* ^/assets/(css|js)/ {
        expires 1h;
    }

    location /assets/ {
        expires 30d;
        access_log off;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
    }

    location = /robots.txt {
        expires 1d;
    }

    location = /favicon.ico {
        expires 30d;
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
               application/manifest+json image/svg+xml;
}
