# ---------------------------------------------------------------------------
# 香港奶龍大學 · production config (HTTPS)
#
# 香港奶龙大学.com  →  xn--psszg58csy9ayt3cnsh.com
#
# Before enabling this file, obtain a certificate (see README):
#   sudo certbot certonly --webroot -w /var/www/nailong \
#     -d xn--psszg58csy9ayt3cnsh.com -d www.xn--psszg58csy9ayt3cnsh.com
#
# Optional: also serve the Traditional Chinese spelling of the domain
# (register it and add it to the certificate first):
#   xn--psszg50dqw9ayt3clqh.com www.xn--psszg50dqw9ayt3clqh.com
# ---------------------------------------------------------------------------

server {
    listen      80;
    listen      [::]:80;
    server_name xn--psszg58csy9ayt3cnsh.com www.xn--psszg58csy9ayt3cnsh.com;

    # Keep ACME renewals working over HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/nailong;
    }

    location / {
        return 301 https://xn--psszg58csy9ayt3cnsh.com$request_uri;
    }
}

# www → apex
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name www.xn--psszg58csy9ayt3cnsh.com;

    ssl_certificate     /etc/letsencrypt/live/xn--psszg58csy9ayt3cnsh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--psszg58csy9ayt3cnsh.com/privkey.pem;

    return 301 https://xn--psszg58csy9ayt3cnsh.com$request_uri;
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name xn--psszg58csy9ayt3cnsh.com;

    ssl_certificate     /etc/letsencrypt/live/xn--psszg58csy9ayt3cnsh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--psszg58csy9ayt3cnsh.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /var/www/nailong;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # One-page gateway: every path shows the splash.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    # Code changes should not be stuck in caches for days.
    location ~* ^/assets/(css|js)/ {
        expires 1h;
    }

    location /assets/ {
        expires 30d;
        access_log off;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
    }

    location = /robots.txt {
        expires 1d;
    }

    location = /favicon.ico {
        expires 30d;
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
               application/manifest+json image/svg+xml;
}
